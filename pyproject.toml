[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-routing"
version = "0.1.0"
description = "Deterministic RU split-routing dataset pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.scripts]
ru-routing = "ru_routing.cli:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "docker_integration: requires the pinned native tools supplied by the Task 10 builder image",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
