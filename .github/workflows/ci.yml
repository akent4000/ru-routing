name: CI

# Fixture-only PR validation (design doc "Validation and Failure Handling":
# "pull-request validation builds exclusively from these committed
# fixtures rather than live upstream fetches, so PR checks are not subject
# to upstream flakiness or rate limits. A separate, independently
# scheduled integration path exercises live sources and is not a gate for
# merging a pull request.").
#
# This workflow MUST NEVER reference R2/Cloudflare/GitHub-release secrets
# and MUST NEVER perform a live upstream fetch or publish anything -- see
# tests/test_workflows.py for the assertions that pin this down.

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege, workflow-level default: read-only. No job in this file
# needs to write repository contents, create releases, or touch R2/
# Cloudflare -- fixture-only validation never publishes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, fixture build/validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install locked package and dev dependencies
        run: uv sync --locked --group dev

      - name: ruff check
        id: ruff
        run: uv run ruff check . 2>&1 | tee ruff-output.log

      - name: pytest (unit/integration test suite)
        id: pytest
        run: uv run pytest -q 2>&1 | tee pytest-output.log

      - name: python -m compileall
        run: uv run python -m compileall -q src

      - name: Fixture-driven check (no live network, no native toolchain)
        id: fixture_check
        run: |
          uv run ru-routing check \
            --fixtures tests/fixtures/upstreams/registry \
            --fake-native-tools \
            2>&1 | tee fixture-check-output.log

      - name: actionlint
        if: always()
        id: actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-connrefused \
            --output "$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${ACTIONLINT_ARCHIVE}" | sha256sum -c -
          tar -xzf "$ACTIONLINT_ARCHIVE" actionlint
          ./actionlint .github/workflows/*.yml

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| ruff | ${{ steps.ruff.outcome }} |"
            echo "| pytest | ${{ steps.pytest.outcome }} |"
            echo "| fixture check (build+validate) | ${{ steps.fixture_check.outcome }} |"
            echo "| actionlint | ${{ steps.actionlint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            ruff-output.log
            pytest-output.log
            fixture-check-output.log
          if-no-files-found: ignore
          retention-days: 14
